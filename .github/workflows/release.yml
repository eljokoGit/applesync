name: Release

# Publication triggered by a tag: git tag v1.2.0 && git push --tags
on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  checks:
    name: Pre-flight checks
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e ".[dev]"

      - name: Does the tag match the version in the code?
        if: startsWith(github.ref, 'refs/tags/v')
        shell: bash
        run: |
          version=$(python -c "import applesync; print(applesync.__version__)")
          tag="${GITHUB_REF_NAME#v}"
          echo "code version: $version — tag: $tag"
          if [ "$version" != "$tag" ]; then
            echo "::error::Tag $GITHUB_REF_NAME does not match __version__ ($version)."
            exit 1
          fi

      - name: Tests
        env:
          QT_QPA_PLATFORM: offscreen
        run: python -m pytest tests -q

  packages:
    name: Python packages
    needs: checks
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Build
        run: |
          python -m pip install --upgrade pip build twine
          python -m build
          python -m twine check dist/*

      - uses: actions/upload-artifact@v4
        with:
          name: packages
          path: dist/

  executable:
    name: Windows executable
    needs: checks
    runs-on: windows-latest
    # Worst case the release ships without an executable: the Python packages
    # remain installable and publication is not blocked.
    continue-on-error: true
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Build the executable
        run: |
          python -m pip install --upgrade pip pyinstaller
          python -m pip install .
          pyinstaller --noconfirm --clean --onefile --windowed `
            --name AppleSync `
            --icon applesync/ui/assets/icon.ico `
            --add-data "applesync/ui/assets/icon.png;applesync/ui/assets" `
            --collect-submodules pymobiledevice3 `
            --collect-data pymobiledevice3 `
            applesync/__main__.py

      - uses: actions/upload-artifact@v4
        with:
          name: windows-executable
          path: dist/AppleSync.exe

  publish:
    name: Publish the release
    needs: [packages, executable]
    if: always() && needs.packages.result == 'success'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/download-artifact@v4
        with:
          path: artifacts

      - name: Gather the files
        run: |
          mkdir -p publish
          cp artifacts/packages/* publish/ 2>/dev/null || true
          cp artifacts/windows-executable/* publish/ 2>/dev/null || true
          ls -l publish

      - name: Create the release
        uses: softprops/action-gh-release@v2
        with:
          files: publish/*
          generate_release_notes: true
          body: |
            See [CHANGELOG.md](https://github.com/eljokoGit/applesync/blob/main/CHANGELOG.md)
            for the detailed list of changes.

            **Installation**

            - Windows, without Python: download `AppleSync.exe` below (when
              present) and double-click it.
            - With Python 3.12+: `pip install applesync-<version>-py3-none-any.whl`

            Reminder: the Apple driver (iTunes, the Apple Devices app or the
            CopyTrans drivers) must be installed for the device to be seen.
