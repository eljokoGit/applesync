[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "applesync"
dynamic = ["version"]
description = "Verifiable backup of an iPhone's photos and videos to a local folder, without conversion, over the Apple protocol (usbmuxd/AFC)."
readme = "README.md"
requires-python = ">=3.12"
license = { text = "MIT" }
keywords = ["iphone", "backup", "photos", "afc", "usbmuxd", "heic", "windows"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Environment :: Win32 (MS Windows)",
    "Intended Audience :: End Users/Desktop",
    "License :: OSI Approved :: MIT License",
    "Natural Language :: French",
    "Operating System :: Microsoft :: Windows",
    "Programming Language :: Python :: 3.12",
    "Topic :: System :: Archiving :: Backup",
]
dependencies = [
    # PINNED version: applesync/device/afc.py uses the internal
    # _send_and_wait API to implement FILE_SEEK (absent from the public API).
    # Any version bump must re-validate copy resume.
    "pymobiledevice3==10.3.1",
    "PySide6>=6.6",
    "Pillow>=10.0",
]

[project.optional-dependencies]
dev = ["pytest>=8.0"]

[project.scripts]
applesync = "applesync.__main__:main"

[project.gui-scripts]
applesync-gui = "applesync.__main__:main"

[project.urls]
Homepage = "https://github.com/eljokoGit/applesync"
Issues = "https://github.com/eljokoGit/applesync/issues"
Changelog = "https://github.com/eljokoGit/applesync/blob/main/CHANGELOG.md"

[tool.setuptools.dynamic]
version = { attr = "applesync.__version__" }

[tool.setuptools.packages.find]
include = ["applesync*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
